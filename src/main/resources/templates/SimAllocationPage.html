<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2: Allocate SIM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #d1d5db;
            --input-bg-readonly: #f3f4f6;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .form-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
        }

        .header-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .step-badge {
            display: inline-block;
            background: #e0e7ff;
            color: #4f46e5;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .alert {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            text-align: center;
        }

        .alert-success {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .form-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        /* Read-only specific styling */
        input[readonly] {
            width: 100%;
            background: var(--input-bg-readonly);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.875rem 1rem 0.875rem 2.5rem; /* Extra left padding for the icon */
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        input[readonly]:focus {
            outline: none;
            /* Prevents the focus ring since the user can't edit it */
        }

        .input-icon {
            position: absolute;
            left: 12px;
            bottom: 14px;
            color: #9ca3af;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary-color);
            color: white;
            padding: 0.875rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="form-card">
    <div class="header-container">
        <span class="step-badge">Step 2 of 2</span>
        <h1>Confirm Allocation</h1>
        <p class="subtitle">Please review the assigned numbers below before finalizing the activation.</p>
    </div>

    <!-- Alerts -->
    <div th:if="${successMessage}" class="alert alert-success">
        <p th:text="${successMessage}" style="margin: 0;"></p>
    </div>
    <div th:if="${errorMessage}" class="alert alert-error">
        <p th:text="${errorMessage}" style="margin: 0;"></p>
    </div>

    <form action="/activation/allocate-sim" method="post">

        <div class="form-group">
            <label for="simNumber">SIM Number</label>
            <!-- Lock Icon SVG -->
            <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <!-- Note: Changed to type="text" to remove the visual number spinners since it's readonly -->
            <input type="text" id="simNumber" name="simNumber" th:value="${param.simNumber}" readonly />
        </div>

        <div class="form-group">
            <label for="serviceNumber">Service Number</label>
            <!-- Lock Icon SVG -->
            <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="text" id="serviceNumber" name="serviceNumber" th:value="${param.serviceNumber}" readonly />
        </div>

        <button type="submit" class="btn-submit">
            Confirm Allocation
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M5 12h14M12 5l7 7-7 7"></path>
            </svg>
        </button>
    </form>
</div>

</body>
</html>
